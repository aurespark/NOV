name: M2 Flutter verify

on:
  push:
    branches: [v6]
  pull_request:
    branches: [v6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inkflow_reader_local_sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

name: inkflow_reader
description: A smooth, privacy-first TXT novel reader.
publish_to: none
version: 0.6.0+6

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  file_picker: ^10.3.10
  http: ^1.2.2
  html: ^0.15.4
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.7
  charset_converter: ^2.3.0
  sqflite: ^2.4.3
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.7+1

flutter:
  uses-material-design: true

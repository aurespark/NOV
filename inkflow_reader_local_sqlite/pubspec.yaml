name: inkflow_reader
description: A smooth, privacy-first TXT novel reader.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  file_picker: any
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.7
  charset_converter: ^2.3.0
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
